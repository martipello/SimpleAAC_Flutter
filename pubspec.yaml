name: simple_aac
description: SimpleAAC - Augmentative Alternative Communication

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^17.2.3

  # State / DI
  rxdart: ^0.28.0
  get_it: ^9.2.1

  # Database / sync
  cloud_firestore: ^6.5.0
  firebase_auth: ^6.5.2
  path_provider: ^2.1.5

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Firebase
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.2.3
  firebase_storage: ^13.4.2
  # firebase_vertexai added in Phase 4 (AI features)

  # Theme
  flex_color_scheme: ^8.4.0

  # UI
  salomon_bottom_bar: ^3.3.2
  diffutil_sliverlist: any
  diffutil_dart: any
  smooth_page_indicator: ^2.0.1
  flutter_speed_dial: ^7.0.0
  expandable: ^5.0.1

  # Storage / Files
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  image_cropper: ^9.1.0
  flutter_image_compress: ^2.4.0

  shimmer: ^3.0.0

  # TTS
  flutter_tts: ^4.0.0
  audioplayers: ^6.0.0
  dart_openai: ^4.1.0

  # AI predictions
  google_generative_ai: ^0.4.0

  # Utilities
  logger: ^2.7.0
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0

  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/simple_aac.png
  android: true
  ios: true

flavorizr:
  app:
    android:
      flavorDimensions: "flavor-type"
    ios:

  flavors:
    dev:
      app:
        name: "Simple AAC DEV"
      android:
        applicationId: "com.sealstudios.simpleaac.dev"
        firebase:
          config: "firebase/dev/google-services.json"
      ios:
        bundleId: "com.sealstudios.simpleaac.dev"
        firebase:
          config: "firebase/dev/GoogleService-Info.plist"

    uat:
      app:
        name: "Simple AAC UAT"
      android:
        applicationId: "com.sealstudios.simpleaac.uat"
        firebase:
          config: "firebase/uat/google-services.json"
      ios:
        bundleId: "com.sealstudios.simpleaac.uat"
        firebase:
          config: "firebase/uat/GoogleService-Info.plist"

    prod:
      app:
        name: "Simple AAC"
      android:
        applicationId: "com.sealstudios.simpleaac"
        firebase:
          config: "firebase/prod/google-services.json"
      ios:
        bundleId: "com.sealstudios.simpleaac"
        firebase:
          config: "firebase/prod/GoogleService-Info.plist"

flutter:
  generate: true
  assets:
    - assets/
    - assets/images/
    - assets/json/
    - assets/fonts/

  uses-material-design: true

  fonts:
    - family: Antipasto
      fonts:
        - asset: assets/fonts/antipasto_regular.ttf
        - asset: assets/fonts/antipasto_extralight.ttf
        - asset: assets/fonts/antipasto_extrabold.ttf
